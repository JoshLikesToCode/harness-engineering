services:
  postgres:
    image: postgres:16-alpine
    container_name: harness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    volumes:
      - harness_postgres_data:/var/lib/postgresql/data

volumes:
  harness_postgres_data:
